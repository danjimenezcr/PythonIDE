<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Curso — PyStudio</title>
    <link rel="stylesheet" href="css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@100;200;300;400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body>

<div class="app-shell">

    <!-- Sidebar -->
    <aside class="sidebar">
        <div class="sidebar-logo">PyStudio</div>
        <nav class="sidebar-nav">
            <a class="sidebar-link" data-page="courses.html" href="courses.html">Mis Cursos</a>
            <a class="sidebar-link" data-page="activities.html" href="activities.html">Actividades</a>
        </nav>
        <div class="sidebar-user">
            <span id="sidebar-user-name" class="sidebar-user-name"></span>
            <span id="sidebar-user-role" class="sidebar-user-role"></span>
            <div class="sidebar-actions">
                <button class="btn-outline" id="logout-btn">Cerrar sesión</button>
            </div>
        </div>
    </aside>

    <!-- Main content -->
    <main class="main-content">

        <!-- Back link -->
        <p class="page-greeting"><a href="courses.html" class="link">← Cursos</a></p>

        <!-- Page header: course name + save button (teachers only) -->
        <div class="page-header" style="margin-top: var(--space-md);">
            <h2 id="course-title" class="section-title">Cargando...</h2>
            <div id="teacher-actions" style="display: none; gap: var(--space-sm);">
                <button class="btn-primary" id="save-course-btn">Guardar</button>
            </div>
        </div>

        <!-- Course detail: left = fields, right = meta panel -->
        <div class="course-detail-header">

            <!-- Left: editable course fields -->
            <div style="display: flex; flex-direction: column; gap: var(--space-lg);">
                <div class="input-component">
                    <p>Nombre del curso</p>
                    <input class="input" id="course-name" type="text" placeholder="Nombre del curso" readonly>
                </div>
                <div class="input-component">
                    <p>Descripción</p>
                    <input class="input" id="course-description" type="text" placeholder="Sin descripción" readonly>
                </div>
                <p id="course-error" class="error-msg" style="display: none;"></p>
            </div>

            <!-- Right: meta panel (teacher, access code) -->
            <div class="course-meta-panel">
                <div>
                    <label>Profesor</label>
                    <span id="course-teacher" class="course-meta-value">—</span>
                </div>
                <div>
                    <label>Código de acceso</label>
                    <span id="course-access-code" class="course-meta-value access-code">—</span>
                </div>
                <div>
                    <label>Estudiantes inscritos</label>
                    <span id="course-members" class="course-meta-value">—</span>
                </div>
            </div>
        </div>

        <!-- Members section -->
        <div class="activities-section">
            <div class="activities-header">
                <h3 class="section-title" style="font-size: 20px;">Estudiantes</h3>
            </div>
            <table class="files-table">
                <thead>
                    <tr>
                        <th>Nombre</th>
                        <th>Correo</th>
                        <th></th>
                    </tr>
                </thead>
                <tbody id="members-list">
                    <tr><td colspan="3" class="empty-state">Cargando...</td></tr>
                </tbody>
            </table>
        </div>

        <!-- Activities section -->
        <div class="activities-section">
            <div class="activities-header">
                <h3 class="section-title" style="font-size: 20px;">Actividades</h3>
                <button class="btn-primary" id="add-activity-btn" style="display: none;">+ Nueva Actividad</button>
            </div>

            <!-- Add activity inline form (teachers only, hidden by default) -->
            <div id="add-activity-form" class="add-assignment-form" style="display: none;">
                <div class="input-component">
                    <p>Título</p>
                    <input class="input" id="activity-title" type="text" placeholder="p. ej. Tarea 1">
                </div>
                <div class="input-component">
                    <p>Descripción</p>
                    <input class="input" id="activity-description" type="text" placeholder="Descripción opcional">
                </div>
                <div class="input-component">
                    <p>Fecha límite</p>
                    <input class="input" id="activity-deadline" type="datetime-local">
                </div>
                <p id="activity-error" class="error-msg" style="display: none;"></p>
                <div class="form-actions">
                    <button class="btn-outline" id="cancel-activity-btn">Cancelar</button>
                    <button class="btn-primary" id="submit-activity-btn">Crear Actividad</button>
                </div>
            </div>

            <!-- Activity list -->
            <div id="activities-list" class="activities-list"></div>
        </div>

        <!-- Groups section (read-only view; groups are created/joined from the desktop client) -->
        <div class="activities-section">
            <div class="activities-header">
                <h3 class="section-title" style="font-size: 20px;">Grupos</h3>
            </div>
            <div id="groups-list"></div>
        </div>

    </main>
</div>

<script src="js/config.js"></script>
<script src="js/app.js"></script>
<script src="js/course.js"></script>
</body>
</html>
