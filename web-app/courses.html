<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mis Cursos</title>
    <link rel="stylesheet" href="css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@10;50;100;200;300;400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body class="courses-page">

    <!-- Top navigation bar -->
    <header class="top-bar">
        <h1 class="app-title">PyStudio</h1>
        <div class="user-info">
            <span id="user-name" class="user-name"></span>
            <button class="btn-outline" id="logout-btn">Cerrar sesión</button>
        </div>
    </header>

    <main class="courses-main">

        <!-- Section header + new course button -->
        <div class="courses-header">
            <h2 class="section-title">Mis Cursos</h2>
            <button class="btn-primary" id="new-course-btn">+ Nuevo Curso</button>
        </div>

        <!-- Create course form (hidden by default, toggled by new-course-btn) -->
        <div id="create-course-form" class="create-form" style="display: none;">
            <div class="input-component">
                <p>Nombre del curso</p>
                <input class="input" id="course-name" type="text" placeholder="Ej. Diseño de Software">
            </div>
            <div class="input-component">
                <p>Descripción</p>
                <input class="input" id="course-description" type="text" placeholder="Descripción opcional">
            </div>
            <p id="create-error" class="error-msg" style="display: none;"></p>
            <button class="btn-primary" id="create-course-submit">Crear Curso</button>
        </div>

        <!-- Course cards grid -->
        <div id="courses-list" class="courses-grid"></div>

        <!-- Activities section — shown when a course card is clicked -->
        <div id="activities-section" class="activities-section" style="display: none;">
            <h2 id="activities-title" class="section-title"></h2>
            <div id="activities-list" class="activities-list"></div>
        </div>

    </main>

    <script src="js/config.js"></script>
    <script src="js/courses.js"></script>
</body>
</html>
