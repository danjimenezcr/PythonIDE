<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Courses — PyStudio</title>
    <link rel="stylesheet" href="css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@100;200;300;400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body>

<div class="app-shell">

    <!-- Sidebar -->
    <aside class="sidebar">
        <div class="sidebar-logo">PyStudio</div>
        <nav class="sidebar-nav">
            <a class="sidebar-link" data-page="courses.html" href="courses.html">Mis Cursos</a>
            <a class="sidebar-link" data-page="activities.html" href="activities.html">Actividades</a>
        </nav>
        <div class="sidebar-user">
            <span id="sidebar-user-name" class="sidebar-user-name"></span>
            <span id="sidebar-user-role" class="sidebar-user-role"></span>
            <div class="sidebar-actions">
                <button class="btn-outline" id="logout-btn">Cerrar Sesion</button>
            </div>
        </div>
    </aside>

    <!-- Main content -->
    <main class="main-content">

        <p class="page-greeting">Bienvenido de nuevo</p>

        <!-- Section header -->
        <div class="page-header">
            <h2 class="section-title">Cursos</h2>
            <button class="btn-primary" id="new-course-btn">+ Nuevo Curso</button>
        </div>

        <!-- Create course form (hidden by default) -->
        <div id="create-course-form" class="create-form" style="display: none;">
            <div class="input-component">
                <p>Nombre del curso</p>
                <input class="input" id="course-name" type="text" placeholder="e.g. Software Design">
            </div>
            <div class="input-component">
                <p>Descripción</p>
                <input class="input" id="course-description" type="text" placeholder="Optional description">
            </div>
            <p id="create-error" class="error-msg" style="display: none;"></p>
            <div class="form-actions">
                <button class="btn-outline" id="cancel-course-btn">Cancelar</button>
                <button class="btn-primary" id="create-course-submit">Crear Curso</button>
            </div>
        </div>

        <!-- Course cards grid -->
        <div id="courses-list" class="courses-grid"></div>

    </main>
</div>

<script src="js/config.js"></script>
<script src="js/app.js"></script>
<script src="js/courses.js"></script>
</body>
</html>
