<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login page</title>
    <link rel="stylesheet" href="css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@10;50;100;200;300;400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body class = "container">
    <div class = "left-panel"> 
        <h1 class = "title">Transmite tu conocimiento!</h1>
        <p class = "light-text">Completa los siguientes pasos para obtener tu usuario.</p>

        <table class = "block">
            <tr>
                <td class = "tag">1</td>
                <td class = "description">Crea tu cuenta</td>
            </tr>
        </table>
        <table class = "block inverse">
            <tr>
                <td class = "tag inverse">2</td>
                <td class = "description">Completa tu perfil</td>
            </tr>
        </table>
        <table class = "block inverse">
            <tr>
                <td class = "tag inverse">3</td>
                <td class = "description">Crea tu primer curso</td>
            </tr>
        </table>
    </div>
    <div class = "right-panel">
        <h1 class = "title" style = "margin-top: 15vh;"> Bienvenido devuelta </h1>
        <p class = "light-text" >Ingresa con tu contraseña y correo.</p>
        
        <form class = "form">
            <div class="input-component" style="margin-top: 10vh;">
                <p>Correo</p>
                <input class = "input singleblock" type="text" placeholder="steve.jobs@apple.com" required>
            </div>
            <div class="input-component" style = "margin-top: 2vh">
                <p>Contraseña</p>
                <input class = "input singleblock" type="password" placeholder="*************" required>
                <p> <a class = "link" href="/forgot-password.html">Olvidaste tu contraseña?</a></a></p>
            </div>

            <button class="button" type="submit">Iniciar sesión</button>
            <p> Aun no tienes una cuenta? <a class = "link" href="/sign-up.html">Registrate aqui</a></p>
            
        </form>

    </div>
</body>
</html>
