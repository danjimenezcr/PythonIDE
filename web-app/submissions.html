<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Submissions — PyStudio</title>
    <link rel="stylesheet" href="css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@100;200;300;400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body>

<div class="app-shell">

    <!-- Sidebar -->
    <aside class="sidebar">
        <div class="sidebar-logo">PyStudio</div>
        <nav class="sidebar-nav">
            <a class="sidebar-link" data-page="courses.html" href="courses.html">My Courses</a>
            <a class="sidebar-link" data-page="activities.html" href="activities.html">Activities</a>
        </nav>
        <div class="sidebar-user">
            <span id="sidebar-user-name" class="sidebar-user-name"></span>
            <span id="sidebar-user-role" class="sidebar-user-role"></span>
            <div class="sidebar-actions">
                <button class="btn-outline" id="logout-btn">Logout</button>
            </div>
        </div>
    </aside>

    <!-- Main content -->
    <main class="main-content">

        <!-- Back link (populated by JS once activity is known) -->
        <p class="page-greeting"><a id="back-link" href="activities.html" class="link">← Back to activity</a></p>

        <div class="page-header" style="margin-top: var(--space-md);">
            <h2 id="activity-title" class="section-title">Loading...</h2>
        </div>

        <p id="submissions-error" class="error-msg" style="display: none;"></p>

        <table class="files-table">
            <thead>
                <tr>
                    <th>Submitted by</th>
                    <th>Files</th>
                    <th>Submitted at</th>
                    <th>Signature</th>
                </tr>
            </thead>
            <tbody id="submissions-list">
                <tr><td colspan="4" class="empty-state">Loading...</td></tr>
            </tbody>
        </table>

    </main>
</div>

<script src="js/config.js"></script>
<script src="js/app.js"></script>
<script src="js/submissions.js"></script>
</body>
</html>
